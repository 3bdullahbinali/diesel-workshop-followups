<!doctype html>
<html lang="ar" dir="rtl" data-display-version="1.1.0">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'self'; base-uri 'self'; object-src 'none'">
<title>الإنجاز وعبء العمل — ورشة الديزل</title>
<style>html,body{margin:0;height:100%;font:15px/1.8 Tahoma,Arial,sans-serif;background:#f1f5f7;color:#163e4a}main{max-width:650px;margin:8vh auto;padding:28px;border-top:4px solid #c9a456}h1{font-size:28px}a{color:#156553}iframe{border:0;display:block;width:100%;height:100vh;height:100dvh}button{font:inherit;padding:9px 18px;border-radius:8px;border:1px solid #bed2d7;background:white;cursor:pointer}#message{white-space:pre-line}[hidden]{display:none!important}.skeleton{height:8px;background:linear-gradient(90deg,#c9dfdf,#217a83,#c9dfdf);background-size:200% 100%;animation:loading 2s linear infinite;border-radius:8px;margin-top:30px}@keyframes loading{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.skeleton{animation:none}}</style>
</head><body>
<main id="loading"><h1>الإنجاز وعبء العمل</h1><p>شعبة ورشة الديزل · Diesel Workshop</p><p id="message" role="status">جارٍ تحميل لوحة الإنجاز والتحقق من إصدار الخدمة…
Loading the achievement dashboard…</p><div class="skeleton" aria-hidden="true"></div><p><a href="./index.html">الموقع الرئيسي / Main website</a> · <a href="?classic=1">العرض الأساسي / Classic view</a></p><button type="button" id="retry">إعادة المحاولة / Retry</button></main>
<iframe id="module" title="الإنجاز وعبء العمل / Achievement and workload" referrerpolicy="no-referrer" allow="fullscreen" hidden></iframe>
<script>
'use strict';
// Presentation-only upgrade. Source reads, writes and permissions remain in the deployed 1.0.1 service.
function enhance(html,js,css){
 const overview="if(view==='overview')content+=overview();", render="content+='</main>';$('#root').innerHTML=content;";
 if(html.split(overview).length!==2||html.split(render).length!==2)throw Error('layout');
 const safeJs=js.replace(/<\/script/gi,'<\\/script'),safeCss=css.replace(/<\/style/gi,'<\\/style');
 return html.replace('</head>','<style>'+safeCss+'</style><script>'+safeJs+'<\/script></head>')
 .replace(overview,"if(view==='overview')content+=window.WorkloadDashboard.overview({data,lang,month,domain});")
 .replace(render,render+'window.WorkloadDashboard.attach({data,lang,month,domain,view});');
}
async function loadModule(){
 const message=document.getElementById('message'),button=document.getElementById('retry');button.disabled=true;
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);
 const get=async url=>{const r=await fetch(url,{cache:'no-store',redirect:'follow',signal:controller.signal});if(!r.ok)throw Error('network');return r;};
 try{
  const c=await(await get('./admin-config.json')).json();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(c.apiUrl||''))throw Error('config');
  const ui=await(await get(c.apiUrl+'?view=workload-ui')).json();
  if(!ui.ok||ui.version!=='1.0.1'||typeof ui.html!=='string'||!ui.html.includes('data-workload-version="1.0.1"'))throw Error('upgrade');
  let html=ui.html;
  if(new URLSearchParams(location.search).get('classic')!=='1'){
   const [js,css]=await Promise.all(['workload-visuals.js','workload-visuals.css'].map(async file=>(await get('./'+file+'?v=1.1.0')).text()));
   html=enhance(html,js,css);
  }
  const frame=document.getElementById('module');frame.srcdoc=html;frame.hidden=false;document.getElementById('loading').hidden=true;
 }catch(error){
  const messages={upgrade:'إصدار الخدمة المنشور لا يطابق واجهة 1.0.1 المتوقعة. لم تتغير بياناتك.\nThe deployed service is not the expected 1.0.1 version. Your data is unchanged.',config:'تعذر قراءة إعداد الاتصال. يجب أن يبقى admin-config.json بجانب هذه الصفحة.\nConnection settings are unavailable. Keep admin-config.json beside this page.',layout:'تغيّر قالب الخدمة؛ استخدم «العرض الأساسي» مؤقتاً لحين تحديث واجهة الإحصائيات.\nThe service template has changed. Use Classic view until the dashboard is updated.'};
  message.textContent=messages[error.message]||'تعذر تحميل الواجهة حالياً. أعد المحاولة أو استخدم العرض الأساسي. لم تُعرض أي بيانات تجريبية.\nThe dashboard could not be loaded. Retry or use Classic view. No sample data is displayed.';
  document.querySelector('.skeleton').style.animation='none';
 }finally{clearTimeout(timer);button.disabled=false;}
}
document.getElementById('retry').addEventListener('click',loadModule);loadModule();
</script></body></html>
