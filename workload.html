<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'self'; base-uri 'self'; object-src 'none'">
<title>الإنجاز وعبء العمل — ورشة الديزل</title>
<style>html,body{margin:0;height:100%;font:15px/1.8 Tahoma,Arial,sans-serif;background:#f2f6f7;color:#163e4a}main{max-width:720px;margin:8vh auto;padding:25px}h1{font-size:25px}a{color:#156553}iframe{border:0;display:block;width:100%;height:100vh}button{font:inherit;padding:7px 18px;cursor:pointer}#message{white-space:pre-line}[hidden]{display:none!important}</style>
</head><body>
<main id="loading"><h1>الإنجاز وعبء العمل</h1><p>شعبة ورشة الديزل · Diesel Workshop</p><p id="message" role="status">جارٍ تحميل الوحدة من سكربت الموقع…
Loading the module from the website's Apps Script…</p><p><a href="./index.html">العودة للموقع الرئيسي / Back to main site</a></p><button type="button" id="retry">إعادة المحاولة / Retry</button></main>
<iframe id="module" title="الإنجاز وعبء العمل / Achievement and workload" referrerpolicy="no-referrer" hidden></iframe>
<script>
'use strict';
async function loadModule(){
 const message=document.getElementById('message'),button=document.getElementById('retry');button.disabled=true;
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);
 try{
  const r=await fetch('./admin-config.json',{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('config');const c=await r.json();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(c.apiUrl||''))throw Error('config');
  const response=await fetch(c.apiUrl+'?view=workload-ui',{redirect:'follow',signal:controller.signal});if(!response.ok)throw Error('network');
  const ui=await response.json();if(!ui.ok||ui.version!=='1.0.1'||typeof ui.html!=='string'||!ui.html.includes('data-workload-version="1.0.1"'))throw Error('upgrade');
  const frame=document.getElementById('module');frame.srcdoc=ui.html;frame.hidden=false;document.getElementById('loading').hidden=true;
 }catch(error){
  message.textContent=error.message==='upgrade'?'صفحة الموقع جاهزة، لكن السكربت المنشور لم يُحدّث بعد. الصق ملف workshop-api.gs الجديد، شغّل setupWorkload، ثم انشر إصداراً جديداً من نفس عملية النشر.\nThe website page is ready. Update Apps Script, run setupWorkload, and publish a new version of the existing deployment.':error.message==='config'?'تعذر قراءة إعداد الاتصال. يجب أن يكون admin-config.json بجانب هذه الصفحة.\nCannot read the connection settings. admin-config.json must be beside this page.':'تعذر تحميل الوحدة حالياً. لم تُعرض بيانات بديلة. تحقق من النشر والاتصال ثم أعد المحاولة.\nThe module could not be loaded. No fallback data is displayed. Verify deployment and connectivity, then retry.';
 }finally{clearTimeout(timer);button.disabled=false;}
}
document.getElementById('retry').addEventListener('click',loadModule);loadModule();
</script></body></html>
